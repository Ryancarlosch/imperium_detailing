name: Flutter Quality

on:
  push:
    branches:
      - desenvolvimento
      - master
      - 'chatgpt/**'
  pull_request:
    branches:
      - desenvolvimento
      - master

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format touched Web files
        run: dart format lib/main_web.dart lib/services/web_analytics_service.dart test/web_analytics_v1_source_test.dart

      - name: Show formatting diff
        shell: bash
        run: |
          git diff -- lib/main_web.dart lib/services/web_analytics_service.dart test/web_analytics_v1_source_test.dart
          git diff --exit-code -- lib/main_web.dart lib/services/web_analytics_service.dart test/web_analytics_v1_source_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Check whitespace
        run: git diff --check

      - name: Build Web release
        run: flutter build web -t lib/main_web.dart --release

      - name: Validate Web bundle
        shell: bash
        run: |
          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/flutter_bootstrap.js
          test -f build/web/sqlite3.wasm
          test -f build/web/sqflite_sw.js

      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: imperium-web-${{ github.sha }}
          path: build/web
          retention-days: 7
          if-no-files-found: error
