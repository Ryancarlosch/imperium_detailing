name: Flutter Quality

on:
  push:
    branches:
      - desenvolvimento
      - master
  pull_request:
    branches:
      - desenvolvimento
      - master

permissions:
  contents: write

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Apply desktop shell upgrade
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/web/web_operacional_shell.dart')
          source = path.read_text(encoding='utf-8')

          if 'final _scaffoldKey = GlobalKey<ScaffoldState>();' not in source:
              source = source.replace(
                  "  final _service = WebCloudOperacionalService.instance;\n  final _moeda = NumberFormat.currency(locale: 'pt_BR', symbol: 'R\\$');\n",
                  "  final _service = WebCloudOperacionalService.instance;\n  final _moeda = NumberFormat.currency(locale: 'pt_BR', symbol: 'R\\$');\n  final _scaffoldKey = GlobalKey<ScaffoldState>();\n",
                  1,
              )

          old_select = """  void _selecionar(int indice, {bool fecharMenu = true}) {
            setState(() => _indice = indice);
            if (fecharMenu && Navigator.canPop(context)) {
              Navigator.pop(context);
            }
          }
          """
          new_select = """  void _selecionar(int indice, {bool fecharMenu = true}) {
            setState(() => _indice = indice);
            if (fecharMenu) {
              _scaffoldKey.currentState?.closeDrawer();
            }
          }
          """
          if old_select in source:
              source = source.replace(old_select, new_select, 1)

          old_expansion = """    return ExpansionTile(
                initiallyExpanded: indices.contains(_indice),
          """
          new_expansion = """    return ExpansionTile(
                key: ValueKey('$titulo-${indices.contains(_indice)}'),
                initiallyExpanded: indices.contains(_indice),
          """
          if old_expansion in source:
              source = source.replace(old_expansion, new_expansion, 1)

          if 'Widget _conteudoMenuLateral()' not in source:
              marker = "  @override\n  Widget build(BuildContext context) {\n    final compacto = MediaQuery.sizeOf(context).width < 760;"
              start = source.index(marker)
              end = source.index("\n}\n\nclass _ClientesPage", start)
              replacement = r'''  Widget _conteudoMenuLateral() {
            return Column(
              children: [
                Padding(
                  padding: const EdgeInsets.fromLTRB(18, 18, 14, 16),
                  child: Row(
                    children: [
                      Container(
                        width: 42,
                        height: 42,
                        decoration: BoxDecoration(
                          color: ImperiumWebTheme.accentStrong.withValues(
                            alpha: 0.12,
                          ),
                          borderRadius: BorderRadius.circular(12),
                        ),
                        child: const Icon(
                          Icons.auto_awesome_mosaic_outlined,
                          color: ImperiumWebTheme.accentStrong,
                        ),
                      ),
                      const SizedBox(width: 12),
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text(
                              'Imperium Manager',
                              style: TextStyle(
                                fontSize: 17,
                                fontWeight: FontWeight.w900,
                              ),
                            ),
                            const SizedBox(height: 2),
                            Text(
                              _nomeEmpresaAtual,
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: const TextStyle(
                                color: Color(0xFFAAB3BD),
                                fontSize: 12,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
                const Divider(height: 1),
                Expanded(child: _menu()),
                const Divider(height: 1),
                Padding(
                  padding: const EdgeInsets.fromLTRB(8, 8, 8, 12),
                  child: ListTile(
                    leading: const CircleAvatar(
                      radius: 17,
                      child: Icon(Icons.person_outline_rounded, size: 18),
                    ),
                    title: const Text(
                      'Conta',
                      style: TextStyle(fontWeight: FontWeight.w800),
                    ),
                    subtitle: Text(
                      widget.usuarioEmail,
                      maxLines: 1,
                      overflow: TextOverflow.ellipsis,
                    ),
                    trailing: IconButton(
                      tooltip: 'Sair',
                      onPressed: widget.onSair,
                      icon: const Icon(Icons.logout_rounded),
                    ),
                  ),
                ),
              ],
            );
          }

          @override
          Widget build(BuildContext context) {
            final largura = MediaQuery.sizeOf(context).width;
            final compacto = largura < 760;
            final desktop = largura >= 1180;

            return Scaffold(
              key: _scaffoldKey,
              drawer: desktop
                  ? null
                  : Drawer(
                      width: compacto ? 310 : 340,
                      child: SafeArea(child: _conteudoMenuLateral()),
                    ),
              appBar: AppBar(
                toolbarHeight: compacto ? 62 : 68,
                automaticallyImplyLeading: false,
                leading: desktop
                    ? null
                    : Builder(
                        builder: (context) => IconButton(
                          tooltip: 'Abrir menu',
                          onPressed: () => Scaffold.of(context).openDrawer(),
                          icon: const Icon(Icons.menu_rounded),
                        ),
                      ),
                titleSpacing: desktop ? 24 : 4,
                title: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Text(
                      desktop
                          ? _tituloAtual
                          : compacto
                          ? _tituloAtual
                          : 'Imperium Manager · $_tituloAtual',
                      maxLines: 1,
                      overflow: TextOverflow.ellipsis,
                      style: const TextStyle(
                        fontSize: 17,
                        fontWeight: FontWeight.w900,
                      ),
                    ),
                    if (!compacto)
                      Text(
                        _nomeEmpresaAtual,
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                        style: const TextStyle(
                          color: Color(0xFFAAB3BD),
                          fontSize: 11,
                          fontWeight: FontWeight.w500,
                        ),
                      ),
                  ],
                ),
                actions: [
                  IconButton(
                    tooltip: 'Atualizar página',
                    onPressed: _atualizar,
                    icon: const Icon(Icons.refresh_rounded),
                  ),
                  PopupMenuButton<String>(
                    tooltip: 'Trocar empresa',
                    onSelected: widget.onTrocarEmpresa,
                    itemBuilder: (context) => widget.empresas
                        .map(
                          (empresa) => PopupMenuItem<String>(
                            value: (empresa['empresa_id'] ?? '').toString(),
                            child: Row(
                              children: [
                                if ('${empresa['empresa_id']}' ==
                                    widget.empresaAtualId) ...[
                                  const Icon(Icons.check_rounded, size: 18),
                                  const SizedBox(width: 8),
                                ],
                                Expanded(
                                  child: Text(
                                    (empresa['nome'] ?? 'Empresa').toString(),
                                  ),
                                ),
                              ],
                            ),
                          ),
                        )
                        .toList(),
                    icon: const Icon(Icons.business_outlined),
                  ),
                  PopupMenuButton<String>(
                    tooltip: widget.usuarioEmail,
                    onSelected: (valor) async {
                      if (valor == 'sair') await widget.onSair();
                    },
                    itemBuilder: (context) => [
                      PopupMenuItem<String>(
                        enabled: false,
                        value: 'email',
                        child: ConstrainedBox(
                          constraints: const BoxConstraints(maxWidth: 260),
                          child: Text(
                            widget.usuarioEmail,
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                          ),
                        ),
                      ),
                      const PopupMenuDivider(),
                      const PopupMenuItem<String>(
                        value: 'sair',
                        child: Row(
                          children: [
                            Icon(Icons.logout_rounded, size: 18),
                            SizedBox(width: 10),
                            Text('Sair'),
                          ],
                        ),
                      ),
                    ],
                    icon: const CircleAvatar(
                      radius: 16,
                      child: Icon(Icons.person_outline_rounded, size: 18),
                    ),
                  ),
                  SizedBox(width: compacto ? 4 : 12),
                ],
              ),
              body: desktop
                  ? Row(
                      children: [
                        Container(
                          width: 300,
                          decoration: const BoxDecoration(
                            color: ImperiumWebTheme.surface,
                            border: Border(
                              right: BorderSide(color: ImperiumWebTheme.border),
                            ),
                          ),
                          child: _conteudoMenuLateral(),
                        ),
                        Expanded(child: _pagina()),
                      ],
                    )
                  : _pagina(),
            );
          }
          '''
              source = source[:start] + replacement + source[end:]

          path.write_text(source, encoding='utf-8')
          PY

      - name: Format Web batch
        run: |
          dart format lib test
          if ! git diff --quiet -- lib test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "feat(web): adiciona menu desktop permanente"
            git push origin HEAD:desenvolvimento
          fi

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Web
        run: flutter build web --target lib/main_web.dart --release

      - name: Check whitespace
        run: git diff --check
