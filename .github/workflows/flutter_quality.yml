name: Flutter Quality

on:
  push:
    branches:
      - desenvolvimento
      - master
  pull_request:
    branches:
      - desenvolvimento
      - master

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # A autoformatacao e commitada pelo workflow Dart Auto Format.
      # Aqui formatamos a copia usada pelo CI para evitar corrida entre os workflows.
      - name: Format Dart sources for CI
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        id: flutter_tests
        shell: bash
        run: |
          set +e
          flutter test 2>&1 | tee flutter-test.log
          test_status=${PIPESTATUS[0]}
          echo "exit_code=$test_status" >> "$GITHUB_OUTPUT"
          exit "$test_status"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log-${{ github.run_id }}
          path: flutter-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build Web
        run: flutter build web --target lib/main_web_bootstrap.dart --release

      - name: Check whitespace
        run: git diff --check
