name: Flutter Quality

on:
  push:
    branches:
      - desenvolvimento
      - master
  pull_request:
    branches:
      - desenvolvimento
      - master

permissions:
  contents: write

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Corrigir compatibilidade e roadmap
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('lib/web/web_dashboard_gerencial_page.dart')
          dashboard_text = dashboard.read_text(encoding='utf-8')
          dashboard_text = dashboard_text.replace(
              'Icons.monitoring_outlined',
              'Icons.insights_outlined',
          )
          dashboard.write_text(dashboard_text, encoding='utf-8')

          roadmap = Path('ROADMAP-IMPERIUM-MESTRE.md')
          roadmap_text = roadmap.read_text(encoding='utf-8')
          roadmap_text = roadmap_text.replace(
              'Última atualização: **2026-09-10**',
              'Última atualização: **2026-09-14**',
              1,
          )
          marker = '## 2026-09-14 — Dashboard premium Web finalizado'
          if marker not in roadmap_text:
              lines = [
                  '',
                  '',
                  '---',
                  '',
                  marker,
                  '',
                  'Módulo: Flutter Web / Dashboard / Gestão',
                  'Status: 🟡 Implementado para homologação visual e funcional',
                  '',
                  'Alterações:',
                  '- Dashboard premium passa a ser a home real do Imperium Web;',
                  '- saldo consolidado por contas ativas com opção de ocultar valores;',
                  '- vendas líquidas, recebido, a receber, ticket médio, OS abertas e agenda aberta;',
                  '- resultado gerencial por competência e ranking comercial da equipe;',
                  '- cards de contas financeiras com snapshot oficial do Financeiro;',
                  '- atalhos diretos para Sistema completo, Contas e Caixa, DRE, Relatórios e Ponto;',
                  '- workspace mantém troca de empresa, usuário e logout;',
                  '- layout responsivo para desktop e telas compactas;',
                  '- Sistema completo preserva Clientes, Veículos, Agenda, OS, Estoque, Financeiro, CRM, Orçamentos, Precificação e Central Cloud.',
                  '',
                  'Segurança/multiempresa:',
                  '- nenhuma alteração em Auth, licença, RLS ou regras de tenant;',
                  '- dashboard continua usando a empresa ativa e os serviços cloud existentes.',
                  '',
                  'Validação:',
                  '- dart format;',
                  '- flutter analyze;',
                  '- flutter test;',
                  '- flutter build web --target lib/main_web.dart --release;',
                  '- git diff --check.',
                  '',
              ]
              roadmap_text += '\n'.join(lines)
          roadmap.write_text(roadmap_text, encoding='utf-8')
          PY

      - name: Apply formatting
        run: dart format lib test

      - name: Commit controlled fix if needed
        run: |
          if ! git diff --quiet -- lib test ROADMAP-IMPERIUM-MESTRE.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test ROADMAP-IMPERIUM-MESTRE.md
            git commit -m "fix(web): finaliza dashboard premium"
            git push
          fi

      - name: Check formatting
        run: git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Web
        run: flutter build web --target lib/main_web.dart --release

      - name: Check whitespace
        run: git diff --check
