name: Format Web Once

on:
  push:
    branches:
      - desenvolvimento
    paths:
      - '.github/workflows/format_web_once.yml'
      - 'lib/main_web.dart'
      - 'lib/services/web_cloud_ponto_service.dart'
      - 'lib/web/imperium_web_theme.dart'
      - 'lib/web/web_ponto_page.dart'
      - 'lib/web/web_workspace_shell.dart'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desenvolvimento

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format changed Web files
        run: |
          dart format \
            lib/main_web.dart \
            lib/services/web_cloud_ponto_service.dart \
            lib/web/imperium_web_theme.dart \
            lib/web/web_ponto_page.dart \
            lib/web/web_workspace_shell.dart

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/main_web.dart \
            lib/services/web_cloud_ponto_service.dart \
            lib/web/imperium_web_theme.dart \
            lib/web/web_ponto_page.dart \
            lib/web/web_workspace_shell.dart
          git commit -m "style(web): aplica dart format"
          git push origin HEAD:desenvolvimento
