name: Web Preview Build

on:
  workflow_dispatch:
  push:
    branches:
      - desenvolvimento
    paths:
      - 'lib/**'
      - 'web/**'
      - 'test/web_*_source_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/web_preview_build.yml'
      - 'scripts/vercel_build.sh'
      - 'vercel.json'

permissions:
  contents: write

concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format navigation once
        run: |
          dart format lib/web/web_operacional_shell.dart test/web_operacional_v1_source_test.dart
          if ! git diff --quiet -- lib/web/web_operacional_shell.dart test/web_operacional_v1_source_test.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/web/web_operacional_shell.dart test/web_operacional_v1_source_test.dart
            git commit -m "style(web): aplica formatter na navegacao"
            git push origin HEAD:desenvolvimento
          fi

      - name: Check Web formatting
        run: dart format --output=none --set-exit-if-changed lib/main_web.dart lib/web test/web_*_source_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run Web source tests
        run: flutter test test/web_*_source_test.dart

      - name: Build Web
        run: flutter build web --target lib/main_web.dart --release

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: imperium-web-build
          path: build/web
          if-no-files-found: error
          retention-days: 3

      - name: Publish static Web branch
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="$(mktemp -d)"
          cp -a build/web/. "$DIST_DIR/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan vercel-web-publish
          git rm -rf .
          cp -a "$DIST_DIR"/. .
          touch .nojekyll
          git add -A -f
          git commit -m "deploy(web): ${GITHUB_SHA}"
          git push --force origin HEAD:vercel-web
