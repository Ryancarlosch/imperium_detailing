name: Web Preview Build

on:
  workflow_dispatch:
  push:
    branches:
      - desenvolvimento
    paths:
      - 'lib/**'
      - 'web/**'
      - 'test/web_*_source_test.dart'
      - 'test/funcionario_conta_email_senha_source_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/web_preview_build.yml'
      - 'scripts/vercel_build.sh'
      - 'vercel.json'

permissions:
  contents: write

concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format auth migration once safely
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            lib/main.dart
            lib/main_web.dart
            lib/screens/login_email_senha_page.dart
            lib/screens/funcionarios_acesso_nuvem_page.dart
            lib/services/cloud_session_service.dart
            lib/services/imperium_auth_service.dart
            lib/services/funcionario_conta_service.dart
            test/web_auth_password_source_test.dart
            test/web_magic_link_auth_source_test.dart
            test/web_operacional_v1_source_test.dart
            test/web_dashboard_navigation_source_test.dart
            test/funcionario_conta_email_senha_source_test.dart
          )

          dart format "${FILES[@]}"

          if ! git diff --quiet -- "${FILES[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${FILES[@]}"
            git commit -m "style(auth): formata migracao de email e senha"
            git fetch origin desenvolvimento
            git rebase origin/desenvolvimento
            git push origin HEAD:desenvolvimento
            echo "Formatação salva. Um novo workflow validará o commit formatado."
            exit 0
          fi

      - name: Check Web formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/main.dart
          lib/main_web.dart
          lib/web
          lib/screens/login_email_senha_page.dart
          lib/screens/funcionarios_acesso_nuvem_page.dart
          lib/services/cloud_session_service.dart
          lib/services/imperium_auth_service.dart
          lib/services/funcionario_conta_service.dart
          test/web_*_source_test.dart
          test/funcionario_conta_email_senha_source_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run Web and auth source tests
        run: >-
          flutter test
          test/web_*_source_test.dart
          test/funcionario_conta_email_senha_source_test.dart

      - name: Build Web
        run: flutter build web --target lib/main_web.dart --release

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: imperium-web-build
          path: build/web
          if-no-files-found: error
          retention-days: 3

      - name: Publish static Web branch
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="$(mktemp -d)"
          cp -a build/web/. "$DIST_DIR/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan vercel-web-publish
          git rm -rf .
          cp -a "$DIST_DIR"/. .
          touch .nojekyll
          git add -A -f
          git commit -m "deploy(web): ${GITHUB_SHA}"
          git push --force origin HEAD:vercel-web
