name: Web Preview Build

on:
  push:
    branches:
      - desenvolvimento
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/web_preview_build.yml'

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Web
        run: flutter build web --target lib/main_web.dart --release

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: imperium-web-build
          path: build/web
          if-no-files-found: error
          retention-days: 3
