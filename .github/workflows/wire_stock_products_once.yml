name: Wire Stock Products Once

on:
  push:
    branches:
      - desenvolvimento
    paths:
      - '.github/workflows/wire_stock_products_once.yml'

permissions:
  contents: write

jobs:
  wire-stock-products:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Wire and fix stock management
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shell_path = Path('lib/web/web_operacional_shell.dart')
          source = shell_path.read_text(encoding='utf-8')
          source = source.replace(
              "import 'web_estoque_movimentacoes_page.dart';\n",
              "import 'web_estoque_gestao_page.dart';\n",
              1,
          )
          source = source.replace(
              "      8 => WebEstoqueMovimentacoesPage(key: ValueKey('estoque-$_revisao')) ,",
              "      8 => WebEstoqueGestaoPage(key: ValueKey('estoque-$_revisao')) ,",
              1,
          )
          source = source.replace(
              "      8 => WebEstoqueMovimentacoesPage(key: ValueKey('estoque-$_revisao')) ,".replace(') ,', '),'),
              "      8 => WebEstoqueGestaoPage(key: ValueKey('estoque-$_revisao')) ,".replace(') ,', '),'),
              1,
          )
          if "import 'web_estoque_gestao_page.dart';" not in source:
              raise SystemExit('stock management import was not wired')
          if '8 => WebEstoqueGestaoPage(' not in source:
              raise SystemExit('stock management route was not wired')
          shell_path.write_text(source, encoding='utf-8')

          movement_path = Path('lib/web/web_estoque_movimentacoes_page.dart')
          source = movement_path.read_text(encoding='utf-8')
          source = source.replace(
              'String _numero(double valor) {',
              'String _numero(num valor) {',
          )
          movement_path.write_text(source, encoding='utf-8')

          product_path = Path('lib/web/web_estoque_produtos_page.dart')
          source = product_path.read_text(encoding='utf-8')
          source = source.replace(
              "  if (resultado.endsWith(')')) resultado = resultado.substring(0, resultado.length - 1);",
              "  if (resultado.endsWith(')')) {\n    resultado = resultado.substring(0, resultado.length - 1);\n  }",
          )
          product_path.write_text(source, encoding='utf-8')

          test_path = Path('test/web_estoque_movimentacoes_source_test.dart')
          source = test_path.read_text(encoding='utf-8')
          source = source.replace(
              "import 'web_estoque_movimentacoes_page.dart';",
              "import 'web_estoque_gestao_page.dart';",
          )
          source = source.replace(
              '8 => WebEstoqueMovimentacoesPage(',
              '8 => WebEstoqueGestaoPage(',
          )
          test_path.write_text(source, encoding='utf-8')
          PY

      - name: Format stock management files
        run: >-
          dart format
          lib/web/web_operacional_shell.dart
          lib/web/web_estoque_gestao_page.dart
          lib/web/web_estoque_movimentacoes_page.dart
          lib/web/web_estoque_produtos_page.dart
          lib/services/web_estoque_produtos_service.dart
          test/web_estoque_movimentacoes_source_test.dart
          test/web_estoque_produtos_source_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run stock Web source tests
        run: >-
          flutter test
          test/web_estoque_movimentacoes_source_test.dart
          test/web_estoque_produtos_source_test.dart

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/web/web_operacional_shell.dart \
            lib/web/web_estoque_gestao_page.dart \
            lib/web/web_estoque_movimentacoes_page.dart \
            lib/web/web_estoque_produtos_page.dart \
            lib/services/web_estoque_produtos_service.dart \
            test/web_estoque_movimentacoes_source_test.dart \
            test/web_estoque_produtos_source_test.dart
          git commit -m 'feat(web): integra cadastro de produtos ao estoque'
          git push origin HEAD:desenvolvimento
