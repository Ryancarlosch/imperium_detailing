name: iOS Build

on:
  push:
    branches:
      - desenvolvimento
    paths:
      - "ios/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios_build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    if: ${{ hashFiles('ios/Runner.xcodeproj/project.pbxproj') != '' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build iOS sem assinatura
        run: flutter build ios --release --no-codesign
