name: Dart Auto Format

on:
  push:
    branches:
      - desenvolvimento
    paths:
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/dart_auto_format.yml'

permissions:
  contents: write

concurrency:
  group: dart-auto-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: desenvolvimento
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format Dart sources
        run: dart format lib test

      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib test; then
            echo "Nenhuma alteração de formatação necessária."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: aplica dart format"
          git push origin HEAD:desenvolvimento
