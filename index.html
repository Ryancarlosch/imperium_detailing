<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Imperium Manager — gestão de clientes, veículos, agenda, ordens de serviço, financeiro e equipe.">
  <meta name="theme-color" content="#090B0E">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Imperium Manager">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>Imperium Manager</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #090b0e;
    }

    body {
      min-width: 320px;
      color: #f4f6f8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #imperium-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 25% 15%, rgba(255, 200, 87, 0.13), transparent 34%),
        radial-gradient(circle at 82% 82%, rgba(155, 183, 255, 0.08), transparent 30%),
        #090b0e;
      opacity: 1;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #imperium-loading.imperium-loading--hidden {
      opacity: 0;
      visibility: hidden;
    }

    .imperium-loading__content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px;
      text-align: center;
    }

    .imperium-loading__mark {
      position: relative;
      display: grid;
      width: 72px;
      height: 72px;
      place-items: center;
      border: 1px solid #353d47;
      border-radius: 22px;
      background: linear-gradient(145deg, #1d2025, #11151a);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.42);
    }

    .imperium-loading__mark::before,
    .imperium-loading__mark::after {
      position: absolute;
      width: 22px;
      height: 22px;
      content: "";
      border: 3px solid #ffc857;
      border-radius: 7px;
    }

    .imperium-loading__mark::before {
      transform: translate(-8px, -8px);
    }

    .imperium-loading__mark::after {
      transform: translate(8px, 8px);
      opacity: 0.62;
    }

    .imperium-loading__title {
      margin-top: 24px;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.18em;
    }

    .imperium-loading__subtitle {
      margin-top: 7px;
      color: #ffc857;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.24em;
    }

    .imperium-loading__status {
      margin-top: 22px;
      color: #8f9aa5;
      font-size: 12px;
    }

    .imperium-loading__bar {
      width: 142px;
      height: 3px;
      margin-top: 14px;
      overflow: hidden;
      border-radius: 99px;
      background: #20262e;
    }

    .imperium-loading__bar::after {
      display: block;
      width: 55%;
      height: 100%;
      content: "";
      border-radius: inherit;
      background: #ffc857;
      animation: imperium-loading-slide 1.1s ease-in-out infinite alternate;
    }

    @keyframes imperium-loading-slide {
      from {
        transform: translateX(-100%);
      }
      to {
        transform: translateX(182%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #imperium-loading {
        transition: none;
      }

      .imperium-loading__bar::after {
        animation: none;
        transform: translateX(42%);
      }
    }
  </style>
</head>
<body>
  <div id="imperium-loading" aria-live="polite" aria-label="Carregando Imperium Manager">
    <div class="imperium-loading__content">
      <div class="imperium-loading__mark" aria-hidden="true"></div>
      <div class="imperium-loading__title">IMPERIUM</div>
      <div class="imperium-loading__subtitle">MANAGER</div>
      <div class="imperium-loading__status">Preparando seu ambiente</div>
      <div class="imperium-loading__bar" aria-hidden="true"></div>
    </div>
  </div>

  <script>
    (() => {
      const hideLoading = () => {
        const loading = document.getElementById('imperium-loading');
        if (!loading || loading.classList.contains('imperium-loading--hidden')) {
          return;
        }
        loading.classList.add('imperium-loading--hidden');
        window.setTimeout(() => loading.remove(), 320);
      };

      window.addEventListener('flutter-first-frame', hideLoading, { once: true });

      const observer = new MutationObserver(() => {
        if (document.querySelector('flt-glass-pane, flt-scene-host, flutter-view')) {
          window.setTimeout(hideLoading, 120);
          observer.disconnect();
        }
      });

      observer.observe(document.documentElement, {
        childList: true,
        subtree: true,
      });

      window.setTimeout(() => observer.disconnect(), 15000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
